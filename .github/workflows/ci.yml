name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -e ".[bots,dashboard,dev,security]"

      - name: Build and type-check CLI
        run: npm run build && npm run check

      - name: Run Python and CLI integration tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Audit dependencies and high-severity Python findings
        run: |
          python -m pip_audit --local
          python -m bandit -r src/nyanya_agent -lll

      - name: Verify release contents and secrets
        run: packaging/release/verify_release.sh
