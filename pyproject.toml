[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyanya-agent"
version = "0.2.1"
description = "A lightweight Python-first messenger bridge and local agent wrapper."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HCS" }]
dependencies = []

[project.optional-dependencies]
bots = ["discord.py>=2.4,<3"]
dashboard = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
nyanya = "nyanya_agent.core:main"
nyanyactl = "nyanya_agent.manager:main"
nyanya-discord = "nyanya_agent.discord_bridge:main"
nyanya-telegram = "nyanya_agent.telegram_bridge:main"
nyanya-dashboard = "nyanya_agent.dashboard_api:main"
nyanya-memory-worker = "nyanya_agent.memory_worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nyanya_agent = ["dashboard_static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
